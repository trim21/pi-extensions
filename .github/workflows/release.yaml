name: Release

on:
  push:
    branches: [master]
    paths:
      - "src/**/*.md"
      - "**/*.wasm"
      - "**/*.wasm"
      - "**/*.ts"
      - "**/*.bpf"
      - .github/workflows/release.yaml
      - package.json

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # npm >= 11 is required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # 版本号唯一来源是 HEAD commit 的 committer 时间（UTC），形如 0.<YYYYMMDD>.<HHMMSS 去掉前导零>。
      # 取 commit 时间而不是当前时间：同一个 commit 重跑得到同一个版本，重复发布会被 npm 拒绝。
      # 用 committer 而不是 author 时间，author 时间可被 rebase 保留或手工指定，会让版本号倒退。
      # 秒数必须转成十进制数去掉前导零，否则 09:xx 的 093000 不是合法 semver。
      - name: Set version from commit timestamp
        run: |
          TS=$(git show -s --format=%ct HEAD)
          DAY=$(date -u -d "@$TS" +%Y%m%d)
          CLOCK=$((10#$(date -u -d "@$TS" +%H%M%S)))
          VERSION="0.$DAY.$CLOCK"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          echo "Publishing @trim21/personal-pi-extensions@$VERSION"

      - name: Publish to npm via OIDC
        run: npm publish --provenance

      - name: Annotate published version
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          echo "::notice title=Published to npm::$NAME@$VERSION"
