name: Release

on:
  push:
    branches: [master]
    paths:
      - "**/*.wasm"
      - "**/*.ts"
      - "**/*.bpf"
      - .github/workflows/release.yaml
      - package.json

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # npm >= 11 is required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # package.json 的 major.minor 是发布版本线的唯一来源，patch 由 commit 数填充，
      # bump 版本线只改 package.json，不需要动本 workflow。
      - name: Set version from commit count
        run: |
          BASE=$(node -p "require('./package.json').version")
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="${BASE%.*}.$COMMIT_COUNT"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          echo "Publishing @trim21/personal-pi-extensions@$VERSION"

      # 打包静态编译的 mihomo（linux-x64）：PATH 找不到 mihomo 时运行时回退用它。
      # 每次发布取 latest release 的 mihomo-linux-amd64-vX.Y.Z.gz（排除 compatible/v1/v2/v3 等变体）。
      - name: Download bundled mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MetaCubeX/mihomo --latest \
            --pattern 'mihomo-linux-amd64-v[0-9].[0-9]*.[0-9]*.gz' --dir mihomo-tmp
          mkdir -p vendor
          gunzip -c mihomo-tmp/*.gz > vendor/mihomo-linux-x64
          rm -rf mihomo-tmp
          chmod 755 vendor/mihomo-linux-x64
          ./vendor/mihomo-linux-x64 -v

      - name: Publish to npm via OIDC
        run: npm publish --provenance
