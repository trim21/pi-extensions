name: Release

on:
  push:
    branches: [master]
    paths:
      - "src/**/*.md"
      - "**/*.wasm"
      - "**/*.wasm"
      - "**/*.ts"
      - "**/*.bpf"
      - .github/workflows/release.yaml
      - package.json

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # npm >= 11 is required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # package.json 的 major.minor 是发布版本线的唯一来源，patch 是 HEAD commit 的 committer 时间
      # （Asia/Shanghai）的 YYYYMMDDHHMMSS，形如 0.1.20260718031031；bump 版本线只改 package.json。
      # 取 commit 时间而不是当前时间：同一个 commit 重跑得到同一个版本，重复发布会被 npm 拒绝。
      # 用 committer 而不是 author 时间，author 时间可被 rebase 保留或手工指定，会让版本号倒退。
      # 固定时区且中国无夏令时，时间戳拼接后与时间前后一致；整串以年份开头，也没有前导零问题。
      - name: Set version from commit timestamp
        run: |
          BASE=$(node -p "require('./package.json').version")
          TS=$(git show -s --format=%ct HEAD)
          STAMP=$(TZ=Asia/Shanghai date -d "@$TS" +%Y%m%d%H%M%S)
          VERSION="${BASE%.*}.$STAMP"
          VERSION="${BASE%.*}.$STAMP"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          echo "Publishing @trim21/personal-pi-extensions@$VERSION"

      - name: Publish to npm via OIDC
        run: npm publish --provenance

      - name: Annotate published version
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          echo "::notice title=Published to npm::$NAME@$VERSION"
