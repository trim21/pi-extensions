name: Update tree-sitter bash wasm

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pnpm-lock.yaml"

jobs:
  update-wasm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      # Only the wasm file is needed; no build scripts required.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Copy vendored wasm from node_modules
        run: cp node_modules/@vscode/tree-sitter-wasm/wasm/tree-sitter-bash.wasm src/bwrap/tree-sitter-bash.wasm

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update tree-sitter-bash.wasm"
          title: "chore: update tree-sitter-bash.wasm"
          body: |
            Auto-generated by CI.

            Updates the vendored `src/bwrap/tree-sitter-bash.wasm` to match the
            `@vscode/tree-sitter-wasm` devDependency. See the note in
            `src/bwrap/approval-rules.ts` for the upgrade procedure.
          branch: chore/update-tree-sitter-bash-wasm
          delete-branch: true
