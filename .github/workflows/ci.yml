name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # engines.node 声明的最低支持线（24）与开发机所在的新版线（26）都要跑
  # lint/check/test，避免只在一版上验证导致版本相关回归漏网。
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

      # bwrap.test.ts imports src/bwrap which resolves the bwrap binary at
      # module load time; bubblewrap is not preinstalled on ubuntu-latest.
      # The claude-code Glob tool and its tests spawn `rg` directly, which is
      # also not preinstalled on ubuntu-latest.
      # Cache the apt packages to avoid re-downloading on every run.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: bubblewrap ripgrep

      # lsp-e2e-pyright-ruff.test.ts 需要真实的 pyright / ruff LSP server
      # （二进制缺失时该测试组自动跳过）。
      - name: Install pyright and ruff
        run: |
          npm install -g pyright
          curl -LsSf https://astral.sh/ruff/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: pnpm test
