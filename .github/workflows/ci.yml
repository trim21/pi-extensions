name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # lint / tsc / prettier 与 Node 版本无关，单独跑一份即可，不放进下面的矩阵。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

  # engines.node 声明的最低支持线（24）与开发机所在的新版线（26）都要跑
  # test，避免只在一版上验证导致版本相关回归漏网。
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # codecov OIDC 上传需要
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 沙箱用例需要 bwrap / mihomo / slirp4netns，claude-code 的 Glob 工具与它的测试直接
      # spawn `rg`：这些都不预装在 ubuntu-latest，统一与开发机一致用 pixi 装到全局环境
      # （mihomo 来自自建 channel）。装最新版而不钉版本：上游更新导致的失败会直接出现在
      # CI 里，再决定是改代码还是收敛版本。
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.76.2
          # 仓库没有 pixi.toml：只装 pixi 本体，依赖走下面的 pixi global install
          run-install: false

      - name: Install sandbox runtime dependencies
        run: |
          pixi global install --channel https://prefix.dev/trim21-pkgs mihomo
          pixi global install bubblewrap
          pixi global install slirp4netns
          pixi global install ripgrep
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      # Ubuntu 24.04 起 AppArmor 默认限制非特权 user namespace，而 bwrap 与网络栈都要靠它
      # 建 namespace；不放开的话真实沙箱用例会被探测整组跳过（CI 上一直是跳过的）。
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # 真实沙箱用例依赖宿主环境：DNS 指向 loopback stub（如 127.0.0.53）时沙箱内的查询
      # 不进 TUN，过滤进程的 dns-hijack 拦不到。用例失败时要能看到这些事实。
      - name: Sandbox environment facts
        run: |
          echo "--- /etc/resolv.conf ---"
          cat /etc/resolv.conf
          echo "--- host resolution ---"
          getent ahostsv4 pypi.org | head -3 || echo "host cannot resolve pypi.org"
          echo "--- /dev/net/tun ---"
          ls -l /dev/net/tun || echo "missing"
          echo "--- binaries ---"
          command -v bwrap mihomo slirp4netns
          echo "--- userns sysctl ---"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true

      # lsp-e2e-pyright-ruff.test.ts 需要真实的 pyright / ruff LSP server，
      # lsp-e2e-tsls.test.ts / lsp-e2e-rename.test.ts 需要真实的
      # typescript-language-server（二进制缺失时对应测试组自动跳过）。
      # TS 本体由测试经 initializationOptions.tsserver.path 指向仓库的
      # node_modules/typescript（typescript-language-server 不内置 TS）。
      - name: Install pyright, ruff and typescript-language-server
        run: |
          npm install -g pyright typescript-language-server
          curl -LsSf https://astral.sh/ruff/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # coverage 在两个 Node 版本上都生成并上传，codecov 合并两次报告。
      # 真实网络栈用例（allowlist 放行/拒绝、超时清理）需要显式开启。
      - run: pnpm test:coverage
        env:
          RUN_NETSTACK_INTEGRATION: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true
          use_oidc: true

  # 矩阵 job 的 check context 带矩阵值（`check (24)`、`check (26)` …），直接写进
  # mergify.yml 会随 matrix 变化失效。这里收敛成单个稳定 context 供合并门槛引用。
  # 名字必须在所有 workflow 里唯一，否则 Mergify 的 check-success 只要任一同名 check
  # 通过就成立；也不要加 `if: always()`，那会让它在矩阵失败时也成功。
  all-checks:
    needs:
      - lint
      - test
    runs-on: ubuntu-slim # 只跑 echo，不需要 ubuntu-latest 的完整镜像与预装工具缓存
    steps:
      - run: echo "all lint and node matrix checks passed"
