name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # lint / tsc / prettier 与 Node 版本无关，单独跑一份即可，不放进下面的矩阵。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

  # engines.node 声明的最低支持线（24）与开发机所在的新版线（26）都要跑
  # test，避免只在一版上验证导致版本相关回归漏网。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # bwrap.test.ts imports src/bwrap which resolves the bwrap binary at
      # module load time; bubblewrap is not preinstalled on ubuntu-latest.
      # The claude-code Glob tool and its tests spawn `rg` directly, which is
      # also not preinstalled on ubuntu-latest.
      # Cache the apt packages to avoid re-downloading on every run.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: bubblewrap ripgrep

      # lsp-e2e-pyright-ruff.test.ts 需要真实的 pyright / ruff LSP server，
      # lsp-e2e-vtsls.test.ts / lsp-e2e-rename.test.ts 需要真实的 vtsls
      # （二进制缺失时对应测试组自动跳过）。
      - name: Install pyright, ruff and vtsls
        run: |
          npm install -g pyright @vtsls/language-server
          curl -LsSf https://astral.sh/ruff/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # coverage 在两个 Node 版本上都生成并上传，codecov 合并两次报告。
      - run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

  # 矩阵 job 的 check context 带矩阵值（`check (24)`、`check (26)` …），直接写进
  # mergify.yml 会随 matrix 变化失效。这里收敛成单个稳定 context 供合并门槛引用。
  # 名字必须在所有 workflow 里唯一，否则 Mergify 的 check-success 只要任一同名 check
  # 通过就成立；也不要加 `if: always()`，那会让它在矩阵失败时也成功。
  all-checks:
    needs:
      - lint
      - test
    runs-on: ubuntu-slim # 只跑 echo，不需要 ubuntu-latest 的完整镜像与预装工具缓存
    steps:
      - run: echo "all lint and node matrix checks passed"
