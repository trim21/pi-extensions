name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

      # bwrap.test.ts imports src/bwrap which resolves the bwrap binary at
      # module load time; bubblewrap is not preinstalled on ubuntu-latest.
      # The claude-code Glob tool and its tests spawn `rg` directly, which is
      # also not preinstalled on ubuntu-latest.
      # Cache the apt packages to avoid re-downloading on every run.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: bubblewrap ripgrep

      - run: pnpm test

  # Windows 行为：bwrap 缺失是预期状态（命令逐条人工审批）、gh-readonly 与
  # spawn-agent 禁用、写保护退化为只能写工作区。平台相关的测试用 skipIf 或
  # 模拟 win32 分支在两边 CI 上分别覆盖。
  # 类型检查与格式检查（pnpm run check，tsc + prettier）只在 Linux job 跑：
  # Windows 只验证平台行为（lint + test）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          autocrlf: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # Glob 测试（globFiles）直接 spawn rg，Windows 镜像未预装 ripgrep。
      - name: Install ripgrep
        run: choco install ripgrep -y

      # bash 由镜像自带的 Git Bash 提供（pi 的本地 shell 执行会找到它）。
      - run: pnpm test
