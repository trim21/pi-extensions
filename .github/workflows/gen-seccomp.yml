name: Generate seccomp BPF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bin/gen_seccomp.py"
      - "pixi.lock"
      - "pixi.toml"

jobs:
  gen-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: "0.63.2"

      - name: Generate seccomp BPF for x86_64
        run: pixi run gen

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update seccomp-x86_64.bpf"
          title: "chore: update seccomp-x86_64.bpf"
          body: |
            Auto-generated by CI on `ubuntu-24.04`.
          branch: chore/update-seccomp-x86_64
          delete-branch: true

  gen-aarch64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: "0.63.2"

      - name: Generate seccomp BPF for aarch64
        run: pixi run gen

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update seccomp-aarch64.bpf"
          title: "chore: update seccomp-aarch64.bpf"
          body: |
            Auto-generated by CI on `ubuntu-24.04-arm`.
          branch: chore/update-seccomp-aarch64
          delete-branch: true
