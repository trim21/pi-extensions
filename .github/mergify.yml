merge_queue:
  max_parallel_checks: 1
  queued_label: "ci:queued"
  dequeued_label: "ci:dequeued"

queue_rules:
  - name: default
    update_method: merge

pull_request_rules:
  - name: label conflicts
    conditions:
      - conflict
    actions:
      label:
        toggle:
          - conflict

  - name: automatic merge
    conditions:
      - base=master
      - or:
          - "#approved-reviews-by>=1"
          - label=ci:auto-merge
      # dev 依赖锁精确版本、peer 范围由人手维护，pi 相关升级必须人工合并
      - label!=ci:manual-merge
      - not:
          and:
            - "head*=renovate/lockfile-maintenance-*"
            - "created-at>24h ago"
      # ci.yml 里的聚合 job，收敛 node 矩阵的多个 check 实例为单一稳定 context
      - check-success=all-checks
    actions:
      queue:
        name: default
